name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  fem:
    # the optional 2D FEM solver (wrmodes[fem]: scikit-fem + gmsh); the gmsh wheel needs libGLU and libXft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for gmsh
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxft2
      - name: Install
        run: python -m pip install -e ".[test,fem]"
      - name: Run the FEM tests
        run: python -m pytest -q tests/test_fem2d.py
